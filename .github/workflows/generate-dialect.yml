name: Generate New Dialect

on:
  # Run quarterly (Jan 1, Apr 1, Jul 1, Oct 1)
  schedule:
    - cron: '0 0 1 1,4,7,10 *'
  # Allow manual trigger with custom theme
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme for the new dialect (e.g., "trending internet slang April 2026")'
        required: false
        default: 'currently trending internet slang and memes'
      model:
        description: 'Claude model to use'
        required: false
        default: 'claude-sonnet-4-20250514'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install anthropic

      - name: Check API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it in Settings > Secrets > Actions."
            exit 1
          fi

      - name: Generate dialect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          THEME="${{ github.event.inputs.theme || 'currently trending internet slang and memes' }}"
          MODEL="${{ github.event.inputs.model || 'claude-sonnet-4-20250514' }}"

          # Generate with auto-detection and validation
          python scripts/generate_dialect.py \
            --auto "$THEME" \
            --model "$MODEL" \
            --validate \
            --output /tmp/new_dialect.yaml

          # Extract dialect name from the YAML
          DIALECT_NAME=$(python -c "import yaml; print(yaml.safe_load(open('/tmp/new_dialect.yaml'))['name'])")
          echo "DIALECT_NAME=$DIALECT_NAME" >> $GITHUB_ENV

          # Copy to definitions directory
          cp /tmp/new_dialect.yaml "bioLOLPython/dialects/definitions/${DIALECT_NAME}.yaml"

          # Add to index if not already there
          if ! grep -q "^${DIALECT_NAME}$" bioLOLPython/dialects/definitions/index.txt; then
            echo "$DIALECT_NAME" >> bioLOLPython/dialects/definitions/index.txt
          fi

      - name: Regenerate gallery
        run: python scripts/generate_gallery.py

      - name: Run tests with new dialect
        run: pytest tests/ -v

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add auto-generated '${{ env.DIALECT_NAME }}' dialect"
          title: "New dialect: ${{ env.DIALECT_NAME }}"
          body: |
            ## Auto-generated dialect

            A new dialect `${{ env.DIALECT_NAME }}` was generated by Claude based on the theme:
            > ${{ github.event.inputs.theme || 'currently trending internet slang and memes' }}

            ### Review checklist
            - [ ] Slang terms feel authentic to the era
            - [ ] Command patterns are distinct and don't conflict with existing dialects
            - [ ] Response templates include proper format placeholders
            - [ ] All tests pass

            Generated with [Claude API](https://docs.anthropic.com/en/docs)
          branch: "dialect/${{ env.DIALECT_NAME }}"
          labels: "dialect,auto-generated"
